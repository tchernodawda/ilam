version: 2

models:
  - name: stg_subscribers
    description: "Staging view over raw bronze subscribers table"
    columns:
      - name: subscriber_id
        description: "Identifiant unique abonné Sonatel"
        data_tests:
          - not_null
          - unique
      - name: msisdn
        description: "Numéro de téléphone au format E.164"
        data_tests:
          - not_null
      - name: account_type
        description: "Type de compte : PREPAID ou POSTPAID"
        data_tests:
          - not_null
          - accepted_values:
              values: ['PREPAID', 'POSTPAID']
      - name: status
        description: "Statut de l'abonné"
        data_tests:
          - not_null
          - accepted_values:
              values: ['ACTIVE', 'INACTIVE', 'SUSPENDED']

  - name: stg_cdr_voice
    description: "Staging view over raw CDR voice table"
    columns:
      - name: cdr_id
        description: "Identifiant unique CDR voix"
        data_tests:
          - not_null
          - unique
      - name: calling_msisdn
        description: "MSISDN appelant"
        data_tests:
          - not_null
      - name: duration_seconds
        description: "Durée de l'appel en secondes"
        data_tests:
          - not_null

  - name: stg_om_transactions
    description: "Staging view over raw Orange Money transactions"
    columns:
      - name: transaction_id
        description: "Identifiant unique transaction Orange Money"
        data_tests:
          - not_null
          - unique
      - name: amount
        description: "Montant de la transaction en XOF"
        data_tests:
          - not_null
      - name: status
        description: "Statut de la transaction"
        data_tests:
          - not_null
          - accepted_values:
              values: ['SUCCESS', 'FAILED', 'PENDING']
