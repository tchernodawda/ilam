version: 2

models:
  - name: subscribers
    description: "Enriched and deduplicated subscriber profiles with segmentation"
    columns:
      - name: subscriber_id
        description: "Identifiant unique abonné Sonatel"
        data_tests:
          - not_null
          - unique
      - name: msisdn
        description: "Numéro de téléphone au format E.164"
        data_tests:
          - not_null
          - unique
      - name: customer_segment
        description: "Segment client calculé selon l'ancienneté"
        data_tests:
          - not_null
          - accepted_values:
              values: ['NEW', 'ESTABLISHED', 'LOYAL', 'PREMIUM']

  - name: cdr_enriched
    description: "Unified CDR table (voice + SMS + data) enriched with subscriber profile"
    columns:
      - name: cdr_id
        description: "Identifiant unique CDR"
        data_tests:
          - not_null
      - name: cdr_type
        description: "Type de CDR : VOICE, SMS ou DATA"
        data_tests:
          - not_null
          - accepted_values:
              values: ['VOICE', 'SMS', 'DATA']

  - name: om_transactions
    description: "Enriched Orange Money transactions with categorization"
    columns:
      - name: transaction_id
        description: "Identifiant unique transaction Orange Money"
        data_tests:
          - not_null
          - unique
      - name: amount
        description: "Montant de la transaction en XOF"
        data_tests:
          - not_null
