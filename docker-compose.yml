x-airflow-env: &airflow-env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW__DATABASE__SQL_ALCHEMY_CONN}
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
  AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
  MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
  MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ilam_admin}
  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-ilam_password_2025}

services:

  postgres:
    image: postgres:15-alpine
    container_name: ilam-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-airflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airflow_password_2025}
      POSTGRES_DB: ${POSTGRES_DB:-airflow}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-airflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ilam-net

  nifi:
    image: apache/nifi:1.23.2
    container_name: ilam-nifi
    restart: unless-stopped
    ports:
      - "8443:8443"
    environment:
      SINGLE_USER_CREDENTIALS_USERNAME: ilam_admin
      SINGLE_USER_CREDENTIALS_PASSWORD: ilam_password_2025
      NIFI_WEB_HTTPS_PORT: 8443
      NIFI_JVM_HEAP_INIT: 512m
      NIFI_JVM_HEAP_MAX: 1g
    volumes:
      - nifi-data:/opt/nifi/nifi-current/data
      - nifi-logs:/opt/nifi/nifi-current/logs
      - nifi-conf:/opt/nifi/nifi-current/conf
    networks:
      - ilam-net
    healthcheck:
      test: ["CMD", "curl", "-f", "-k", "https://localhost:8443/nifi"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
  
  iceberg-catalog-db:
    image: postgres:15-alpine
    container_name: ilam-iceberg-catalog-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: iceberg_catalog
      POSTGRES_USER: iceberg
      POSTGRES_PASSWORD: iceberg_catalog_2025
    volumes:
      - iceberg_catalog_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "iceberg", "-d", "iceberg_catalog"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ilam-net

  minio:
    image: minio/minio:latest
    container_name: ilam-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ilam_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-ilam_password_2025}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - ilam-net

  minio-init:
    image: minio/mc:latest
    container_name: ilam-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ilam_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-ilam_password_2025}
    entrypoint: /bin/sh
    command:
      - -c
      - |
        mc alias set ilam http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}
        mc mb --ignore-existing ilam/warehouse
        mc mb --ignore-existing ilam/raw-data
        mc mb --ignore-existing ilam/flink-checkpoints
        mc mb --ignore-existing ilam/ilam-logs
        echo "Buckets initialized successfully"
    networks:
      - ilam-net

  iceberg-rest:
    image: tabulario/iceberg-rest:latest
    container_name: ilam-iceberg-rest
    restart: unless-stopped
    depends_on:
      minio:
        condition: service_healthy
      iceberg-catalog-db:
        condition: service_healthy
    environment:
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_ACCESS__KEY__ID: ilam_admin
      CATALOG_S3_SECRET__ACCESS__KEY: ilam_password_2025
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ilam_admin
      AWS_SECRET_ACCESS_KEY: ilam_password_2025
      CATALOG_URI: jdbc:postgresql://iceberg-catalog-db:5432/iceberg_catalog
      CATALOG_JDBC_USER: iceberg
      CATALOG_JDBC_PASSWORD: iceberg_catalog_2025
    ports:
      - "8181:8181"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8181/v1/config"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 120s
    networks:
      - ilam-net

  kafka:
    image: apache/kafka:latest
    container_name: ilam-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://ilam-kafka:9092,EXTERNAL://localhost:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@ilam-kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_HEAP_OPTS: "-Xmx256m -Xms128m"
    ports:
      - "9092:9092"
      - "9094:9094"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - ilam-net

  trino:
    image: trinodb/trino:435
    container_name: ilam-trino
    restart: unless-stopped
    depends_on:
      minio:
        condition: service_healthy
      iceberg-rest:
        condition: service_started
    volumes:
      - ./infra/trino/catalog:/etc/trino/catalog
      - ./infra/trino/config/config.properties:/etc/trino/config.properties
      - ./infra/trino/config/jvm.config:/etc/trino/jvm.config
    ports:
      - "${TRINO_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/info"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - ilam-net

  flink-jobmanager:
    build:
      context: ./infra/flink
      dockerfile: Dockerfile
    image: ilam-flink:1.18
    container_name: ilam-flink-jobmanager
    restart: unless-stopped
    command: jobmanager
    volumes:
      - ./infra/flink/jars/flink-connector-kafka-3.1.0-1.18.jar:/opt/flink/lib/flink-connector-kafka-3.1.0-1.18.jar
      - ./infra/flink/jars/iceberg-flink-runtime-1.18-1.5.2.jar:/opt/flink/lib/iceberg-flink-runtime-1.18-1.5.2.jar
      - ./infra/flink/jars/flink-shaded-hadoop-2-uber-2.8.3-10.0.jar:/opt/flink/lib/flink-shaded-hadoop-2-uber-2.8.3-10.0.jar
      - ./infra/flink/jars/bundle-2.20.18.jar:/opt/flink/lib/bundle-2.20.18.jar
      - ./infra/flink/jars/kafka-clients-3.4.0.jar:/opt/flink/lib/kafka-clients-3.4.0.jar
      - ./infra/flink/flink-conf-extra.yaml:/opt/flink/conf/flink-conf-extra.yaml
      - ./infra/flink/jars/flink-s3-fs-hadoop-1.18.1.jar:/opt/flink/lib/flink-s3-fs-hadoop-1.18.1.jar
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        jobmanager.memory.process.size: 1024m
        parallelism.default: 1
        s3.endpoint: http://minio:9000
        s3.access-key: ilam_admin
        s3.secret-key: ilam_password_2025
        s3.path.style.access: true
        s3.ssl.enabled: false
        state.backend: hashmap
        state.checkpoints.dir: s3://flink-checkpoints/jobs
        execution.checkpointing.interval: 30000
        execution.checkpointing.mode: EXACTLY_ONCE
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ilam_admin
      AWS_SECRET_ACCESS_KEY: ilam_password_2025
      AWS_DEFAULT_REGION: us-east-1 
    ports:
      - "${FLINK_JOBMANAGER_PORT:-8081}:8081"
      - "8081:8081"
      - "8083:8083"
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/overview"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - ilam-net

  flink-taskmanager:
    build:
      context: ./infra/flink
      dockerfile: Dockerfile
    image: ilam-flink:1.18
    container_name: ilam-flink-taskmanager
    restart: unless-stopped
    command: taskmanager
    depends_on:
      - flink-jobmanager
    volumes:
      - ./infra/flink/jars/flink-connector-kafka-3.1.0-1.18.jar:/opt/flink/lib/flink-connector-kafka-3.1.0-1.18.jar
      - ./infra/flink/jars/iceberg-flink-runtime-1.18-1.5.2.jar:/opt/flink/lib/iceberg-flink-runtime-1.18-1.5.2.jar
      - ./infra/flink/jars/flink-shaded-hadoop-2-uber-2.8.3-10.0.jar:/opt/flink/lib/flink-shaded-hadoop-2-uber-2.8.3-10.0.jar
      - ./infra/flink/jars/bundle-2.20.18.jar:/opt/flink/lib/bundle-2.20.18.jar
      - ./infra/flink/jars/kafka-clients-3.4.0.jar:/opt/flink/lib/kafka-clients-3.4.0.jar
      - ./infra/flink/flink-conf-extra.yaml:/opt/flink/conf/flink-conf-extra.yaml
      - ./infra/flink/jars/flink-s3-fs-hadoop-1.18.1.jar:/opt/flink/lib/flink-s3-fs-hadoop-1.18.1.jar
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.memory.process.size: 1024m
        taskmanager.numberOfTaskSlots: 2
        parallelism.default: 1
        s3.endpoint: http://minio:9000
        s3.access-key: ilam_admin
        s3.secret-key: ilam_password_2025
        s3.path.style.access: true
        s3.ssl.enabled: false
        state.backend: hashmap
        state.checkpoints.dir: s3://flink-checkpoints/jobs
        execution.checkpointing.interval: 30000
        execution.checkpointing.mode: EXACTLY_ONCE
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ilam_admin
      AWS_SECRET_ACCESS_KEY: ilam_password_2025
      AWS_DEFAULT_REGION: us-east-1  
    networks:
      - ilam-net

  flink-streaming-job:
    build:
      context: ./infra/flink
      dockerfile: Dockerfile
    image: ilam-flink:1.18
    container_name: ilam-flink-streaming-job
    restart: unless-stopped
    depends_on:
      flink-jobmanager:
        condition: service_healthy
      kafka:
        condition: service_healthy
    command: >
      bash -c "
        echo 'Waiting for Flink cluster...' &&
        sleep 45 &&
        echo 'Submitting PyFlink job...' &&
        python3 /opt/flink/usrjobs/flink_cdr_job.py &&
        echo 'Job submitted successfully' &&
        sleep infinity
      "
    volumes:
      - ./ingestion/streaming/flink_cdr_job.py:/opt/flink/usrjobs/flink_cdr_job.py
    networks:
      - ilam-net

  airflow-init:
    image: apache/airflow:2.8.1
    container_name: ilam-airflow-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *airflow-env
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username ilam_admin \
          --password ilam_password_2025 \
          --firstname Ilam \
          --lastname Admin \
          --role Admin \
          --email admin@ilam.io
    networks:
      - ilam-net

  airflow-webserver:
    image: apache/airflow:2.8.1
    container_name: ilam-airflow-webserver
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      <<: *airflow-env
    volumes:
      - airflow_logs:/opt/airflow/logs
    ports:
      - "${AIRFLOW_PORT:-8082}:8080"
    command: webserver
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 20s
      timeout: 10s
      retries: 5
    networks:
      - ilam-net

  airflow-scheduler:
    image: apache/airflow:2.8.1
    container_name: ilam-airflow-scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      <<: *airflow-env
    volumes:
      - airflow_logs:/opt/airflow/logs
    command: scheduler
    networks:
      - ilam-net

  spark-master:
    image: apache/spark:3.5.0
    container_name: ilam-spark-master
    user: root
    environment:
      - AWS_ACCESS_KEY_ID=ilam_admin
      - AWS_SECRET_ACCESS_KEY=ilam_password_2025
      - AWS_REGION=us-east-1
    ports:
      - "8090:8080"
      - "7077:7077"
    command: >
      bash -c "/opt/spark/bin/spark-class
      org.apache.spark.deploy.master.Master
      --host spark-master
      --port 7077
      --webui-port 8080"
    networks:
      - ilam-net
    restart: unless-stopped

  spark-worker:
    image: apache/spark:3.5.0
    container_name: ilam-spark-worker
    user: root
    environment:
      - AWS_ACCESS_KEY_ID=ilam_admin
      - AWS_SECRET_ACCESS_KEY=ilam_password_2025
      - AWS_REGION=us-east-1
    depends_on:
      - spark-master
    command: >
      bash -c "/opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      --memory 1g
      --cores 2
      spark://spark-master:7077"
    networks:
      - ilam-net
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: ilam-prometheus
    restart: unless-stopped
    volumes:
      - ./infra/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    networks:
      - ilam-net

  grafana:
    image: grafana/grafana:latest
    container_name: ilam-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-ilam_password_2025}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    networks:
      - ilam-net

networks:
  ilam-net:
    name: ilam-network
    driver: bridge

volumes:
  postgres_data:
    name: ilam-postgres-data
  nifi-data:
    name: ilam-nifi-data
  nifi-logs:
    name: ilam-nifi-logs
  nifi-conf:
    name: ilam-nifi-conf
  minio_data:
    name: ilam-minio-data
  airflow_logs:
    name: ilam-airflow-logs
  prometheus_data:
    name: ilam-prometheus-data
  grafana_data:
    name: ilam-grafana-data
  iceberg_catalog_db:
    name: ilam-iceberg-catalog-db
  kafka_data:
    name: ilam-kafka-data
  spark_master_data:
    name: ilam-spark-master-data
  spark_worker_data:
    name: ilam-spark-worker-data    
 