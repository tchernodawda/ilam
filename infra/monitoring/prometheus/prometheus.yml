global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: ilam
    environment: local

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: ilam_exporter
    static_configs:
      - targets: ["ilam-exporter:8089"]
    metrics_path: /metrics

  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ["minio:9000"]
